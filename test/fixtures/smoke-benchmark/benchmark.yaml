# A tiny benchmark for tests and quick local checks. Its numbers mean
# nothing; they only have to be reproducible.
name: smoke
title: Smoke benchmark
description: Two short tests, two seeded repeats each.
version: 1
harness:
  repo: https://github.com/menloresearch/humanoid-policy-viewer
  protocol: 2
requires:
  robot: { name: asimov-1 }
  policy_interface: velocity-command
defaults:
  repeats: 2
  seed: 0
  randomize:
    action_delay: env_range
    initial_joint_noise_rad: 0.01
  timeout_s: 300
tests:
  - { config: locomotion }
  - { config: push_standing }
tasks:
  - { id: survival_rate, metric: survival_rate@2 }
  - { id: survival_time, metric: survival_time@2 }
  - { id: push_survival_rate, metric: survival_rate@2, scope: { config: push_standing } }
