# A tiny suite for tests and quick local checks. Not a benchmark: its numbers
# mean nothing, they only have to be reproducible.
suite: smoke
title: Smoke suite
description: Two short tests, two seeded repeats each.
version: 1
harness:
  repo: https://github.com/menloresearch/humanoid-policy-viewer
  protocol: 1
requires:
  robot: { name: asimov-1 }
  policy_interface: velocity-command
defaults:
  repeats: 2
  seed: 0
  randomize:
    action_delay: env_range
    initial_joint_noise_rad: 0.01
  timeout_s: 300
tests:
  - { config: locomotion }
  - { config: push_standing }
tasks:
  - { id: survival_rate, metric: survival_rate@1 }
  - { id: survival_time, metric: survival_time@1 }
  - { id: push_survival_rate, metric: survival_rate@1, scope: { config: push_standing } }
