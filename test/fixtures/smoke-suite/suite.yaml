# A tiny suite for tests and quick local checks. Not a benchmark: its numbers
# mean nothing, they only have to be reproducible.
suite: smoke
title: Smoke suite
description: Two short tests, two seeded repeats each.
version: 1
harness:
  repo: https://github.com/menloresearch/humanoid-policy-viewer
  protocol: 1
requires:
  robot: { name: asimov-1 }
  policy_interface: velocity-command
defaults:
  repeats: 2
  seed: 0
  randomize:
    action_delay: env_range
    initial_joint_noise_rad: 0.01
  aggregate: mean
  pass_rule: all_repeats
  timeout_s: 300
tests:
  - { config: locomotion }
  - { config: push_standing }
tasks:
  - { id: upright_rate, metric: upright_rate }
  - { id: tracking_score, metric: tracking_score, scope: { config: locomotion } }
  - { id: push_reasonable_pass, metric: push_pass_rate, scope: { tier: reasonable } }
  - { id: push_max_force_n, metric: max_force_survived_n, scope: { config: push_standing } }
